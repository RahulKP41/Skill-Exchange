services:
  mysql:
    image: mysql:8.4
    container_name: skill-exchange-mysql
    environment:
      MYSQL_DATABASE: skill_exchange
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: skill_user
      MYSQL_PASSWORD: skill_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  spring-api:
    build:
      context: ./backend/spring-api
    container_name: skill-exchange-spring-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/skill_exchange?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: skill_user
      SPRING_DATASOURCE_PASSWORD: skill_pass
      APP_JWT_SECRET: super-secret-access-key-change-me
      APP_REFRESH_SECRET: super-secret-refresh-key-change-me
      APP_JITSI_BASE_URL: https://meet.jit.si
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8080"

  node-gateway:
    build:
      context: ./backend/node-gateway
    container_name: skill-exchange-node-gateway
    environment:
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: skill_exchange
      DB_USER: skill_user
      DB_PASSWORD: skill_pass
      JWT_SECRET: super-secret-access-key-change-me
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
    container_name: skill-exchange-frontend
    depends_on:
      - spring-api
      - node-gateway
    ports:
      - "8080:80"

volumes:
  mysql_data:

