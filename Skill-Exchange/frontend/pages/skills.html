<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills | Skill Exchange</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-auth="required">
  <nav class="navbar navbar-expand-lg navbar-skillx fixed-top">
    <div class="container py-2">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/pages/dashboard.html"><span class="brand-mark">SX</span><span>Skill Exchange</span></a>
      <div class="collapse navbar-collapse show">
        <ul class="navbar-nav ms-auto me-3">
          <li class="nav-item"><a class="nav-link" href="/pages/dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/profile.html">Profile</a></li>
          <li class="nav-item"><a class="nav-link active" href="/pages/skills.html">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="/pages/matches.html">Matches</a></li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <div data-nav-user></div>
          <button class="btn btn-soft" data-logout>Log out</button>
        </div>
      </div>
    </div>
  </nav>
  <main class="page-shell">
    <section class="container">
      <div class="page-title">
        <div>
          <span class="section-kicker">Skills</span>
          <h1 class="mt-2">Tell the platform what you teach and what you want to learn</h1>
        </div>
        <p>Balanced teach and learn profiles produce better matches and more relevant exchange requests.</p>
      </div>
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="glass-panel">
            <h3 class="mb-3">Add a skill</h3>
            <form id="addSkillForm" class="row g-3">
              <div class="col-12"><label class="form-label">Skill</label><select class="form-select" name="skillId"></select></div>
              <div class="col-md-6"><label class="form-label">Skill type</label><select class="form-select" name="skillType"><option>TEACH</option><option>LEARN</option></select></div>
              <div class="col-md-6"><label class="form-label">Level</label><select class="form-select" name="proficiencyLevel"><option>BEGINNER</option><option>INTERMEDIATE</option><option>ADVANCED</option><option>EXPERT</option></select></div>
              <div class="col-12"><label class="form-label">Years of experience</label><input class="form-control" type="number" name="yearsOfExperience" min="0" value="0"></div>
              <div class="col-12"><label class="form-label">Highlights</label><textarea class="form-control" name="highlights" rows="3"></textarea></div>
              <div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="featured" id="featured"><label class="form-check-label" for="featured">Feature this skill on my profile</label></div>
              <div class="col-12"><button class="btn btn-brand" type="submit">Save skill</button></div>
            </form>
          </div>
        </div>
        <div class="col-lg-8">
          <div class="glass-panel mb-4">
            <h3 class="mb-3">My skill stack</h3>
            <div class="row g-3" id="mySkills"></div>
          </div>
          <div class="glass-panel">
            <h3 class="mb-3">Skill catalog</h3>
            <div class="row g-3" id="skillCatalog"></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/skills.js"></script>
</body>
</html>
